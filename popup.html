<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
body{font-family:system-ui,sans-serif;width:340px;margin:12px;font-size:14px}
label{display:block;margin:10px 0 4px;font-weight:600}
textarea,input[type=number]{width:100%;box-sizing:border-box;padding:6px}
textarea{height:76px}
.row{display:flex;align-items:center;gap:6px;margin:8px 0}
button{padding:7px 12px;cursor:pointer}
#status{color:#555;margin-top:8px;white-space:pre-wrap}
small{color:#666}
</style></head><body>
<h3 style="margin:0 0 4px">Site Auto Reload</h3>
<small>対象パターンに合うタブだけを定期リロードします</small>

<label><input type="checkbox" id="enabled"> 有効にする</label>

<label>対象サイト（1行に1つ、* がワイルドカード）</label>
<textarea id="patterns" placeholder="https://example.com/*&#10;*zabbix*"></textarea>
<small>例: <code>https://intra.example.com/dashboard*</code><br>単に <code>zabbix</code> と書けば URL に含むタブが対象</small>

<label>リロード間隔（秒・30以上）</label>
<input type="number" id="intervalSec" min="30" step="10" value="60">

<div class="row"><input type="checkbox" id="bypassCache"><span>キャッシュを無視してリロード</span></div>
<div class="row"><input type="checkbox" id="skipActive"><span>今見ているタブはリロードしない</span></div>

<button id="save">保存</button>
<button id="now">今すぐ対象タブをリロード</button>
<div id="status"></div>
<script src="popup.js"></script>
</body></html>
